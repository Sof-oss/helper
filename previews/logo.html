<!doctype html><html lang="ru"><head><meta charset="utf-8">
<!-- Логотип «Сердце Зоны»: знак радиации из волн-дуг (SVG из src/zone-sign.js) и 3D-сердце в центре (src/zone-heart.js) -
     та же модель, свет и знак, что в заставке. Рисует build-logo.js: открывает страницу через локальный сервер
     и вызывает window.renderLogo(...) -->
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<style>html,body{margin:0;background:#11161c}</style>
</head><body>
<script type="module">
import { WebGLRenderer, Scene, PerspectiveCamera, PMREMGenerator, Euler, Vector3, SRGBColorSpace, ACESFilmicToneMapping } from "three";
import { RoomEnvironment } from "three/addons/environments/RoomEnvironment.js";
import { createHeart, createHeartLights, LOGO_HEART, LOGO_BEAT } from "/src/zone-heart.js";
import { SIGN, signSVG } from "/src/zone-sign.js";

const BIG = 1536; // рабочий размер, итог - уменьшением (сглаживание без зубцов)

/* 3D-сердце на прозрачном фоне: кадр = сторона знака, центр тела - в центре кадра */
function renderHeart(px) {
  const canvas = document.createElement("canvas");
  const renderer = new WebGLRenderer({ canvas, antialias: true, alpha: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(px, px, false);
  renderer.setClearColor(0x000000, 0);
  renderer.toneMapping = ACESFilmicToneMapping;
  renderer.outputColorSpace = SRGBColorSpace;
  const scene = new Scene();
  const camera = new PerspectiveCamera(35, 1, 0.1, 50);
  camera.position.set(0, 0, 8.6);
  const pm = new PMREMGenerator(renderer);
  scene.environment = pm.fromScene(new RoomEnvironment(), 0.04).texture;
  scene.environmentIntensity = 0.6;
  const heart = createHeart();
  heart.beat(LOGO_BEAT);
  scene.add(heart.group);
  const vh = 2 * camera.position.z * Math.tan((camera.fov * Math.PI) / 360);
  const s = (LOGO_HEART.h * vh) / heart.height;
  heart.group.scale.setScalar(s);
  heart.group.position.copy(heart.anchor).multiplyScalar(-s);
  createHeartLights(scene).place(new Vector3(), new Euler(), s);
  renderer.render(scene, camera);
  const out = document.createElement("canvas");
  out.width = out.height = px;
  out.getContext("2d").drawImage(canvas, 0, 0);
  heart.dispose(); pm.dispose(); renderer.dispose();
  return out;
}

function downscale(src, size) {
  let c = src;
  while (c.width / 2 >= size) {
    const n = document.createElement("canvas");
    n.width = n.height = Math.round(c.width / 2);
    const g = n.getContext("2d");
    g.imageSmoothingQuality = "high";
    g.drawImage(c, 0, 0, n.width, n.height);
    c = n;
  }
  const n = document.createElement("canvas");
  n.width = n.height = size;
  const g = n.getContext("2d");
  g.imageSmoothingQuality = "high";
  g.drawImage(c, 0, 0, size, size);
  return n;
}

const svgImage = svg =>
  new Promise((ok, bad) => {
    const im = new Image();
    im.onload = () => ok(im);
    im.onerror = bad;
    im.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  });

let heartCache = null;
/* o: size - итоговый размер, bands - 3 (логотип) или 2 (favicon), heartOnly - только сердце (для шапки, знак там - живой SVG),
   bg - фон (apple-touch-icon), pad - поле, type */
window.renderLogo = async o => {
  const S = BIG;
  const preset = o.bands === 2 ? SIGN.small : SIGN.logo;
  const c = document.createElement("canvas");
  c.width = c.height = S;
  const g = c.getContext("2d");
  const pad = o.pad || 0;
  if (o.bg) {
    const gr = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S * 0.72);
    gr.addColorStop(0, "#2a1410");
    gr.addColorStop(0.55, "#120d10");
    gr.addColorStop(1, "#0a0c10");
    g.fillStyle = gr;
    g.fillRect(0, 0, S, S);
  }
  g.save();
  g.translate(S * pad, S * pad);
  g.scale(1 - 2 * pad, 1 - 2 * pad);
  if (!o.heartOnly) g.drawImage(await svgImage(signSVG(preset).replace("<svg", `<svg width="${S}" height="${S}"`)), 0, 0, S, S);
  heartCache = heartCache || renderHeart(S);
  const k = o.bands === 2 ? 1.12 : 1; // в favicon сердце крупнее
  g.drawImage(heartCache, (S - S * k) / 2, (S - S * k) / 2, S * k, S * k);
  g.restore();
  return downscale(c, o.size).toDataURL(o.type || "image/png", o.quality || 0.95);
};
window.ready = true;
</script></body></html>
