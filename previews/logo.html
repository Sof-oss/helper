<!doctype html><html lang="ru"><head><meta charset="utf-8">
<!-- Логотип «Сердце Зоны»: неоновый знак радиации (SVG из src/zone-sign.js) и сердце-артефакт «Огненный шар» в центре
     (src/zone-artifact.js). Рисует build-logo.js: открывает страницу через локальный сервер и вызывает window.renderLogo(...) -->
<script type="importmap">{"imports":{"three":"/node_modules/three/build/three.module.js","three/addons/":"/node_modules/three/examples/jsm/"}}</script>
<style>html,body{margin:0;background:#11161c}</style>
</head><body>
<script type="module">
import { renderArtifact } from "/src/zone-artifact.js";
import { SIGN, signSVG } from "/src/zone-sign.js";

const BIG = 1536; // рабочий размер, итог - уменьшением (сглаживание без зубцов)
/* сердце чуть больше внутреннего круга знака и заходит на лопасти; в мелких иконках - ещё крупнее */
const HEART_K = { logo: 1.1, small: 1.2 };

function downscale(src, size) {
  let c = src;
  while (c.width / 2 >= size) {
    const n = document.createElement("canvas");
    n.width = n.height = Math.round(c.width / 2);
    const g = n.getContext("2d");
    g.imageSmoothingQuality = "high";
    g.drawImage(c, 0, 0, n.width, n.height);
    c = n;
  }
  const n = document.createElement("canvas");
  n.width = n.height = size;
  const g = n.getContext("2d");
  g.imageSmoothingQuality = "high";
  g.drawImage(c, 0, 0, size, size);
  return n;
}

const svgImage = svg =>
  new Promise((ok, bad) => {
    const im = new Image();
    im.onload = () => ok(im);
    im.onerror = bad;
    im.src = "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
  });

let heartCache = null;
/* o: size - итоговый размер, small - мелкая иконка (favicon: знак без кольца, сердце крупнее),
   heartOnly - только сердце (для шапки, знак там - живой SVG),
   bg - фон (apple-touch-icon), pad - поле, type */
window.renderLogo = async o => {
  const S = BIG;
  const preset = o.small ? SIGN.small : SIGN.logo;
  const c = document.createElement("canvas");
  c.width = c.height = S;
  const g = c.getContext("2d");
  const pad = o.pad || 0;
  if (o.bg) {
    const gr = g.createRadialGradient(S / 2, S / 2, 0, S / 2, S / 2, S * 0.72);
    gr.addColorStop(0, "#2a1410");
    gr.addColorStop(0.55, "#120d10");
    gr.addColorStop(1, "#0a0c10");
    g.fillStyle = gr;
    g.fillRect(0, 0, S, S);
  }
  g.save();
  g.translate(S * pad, S * pad);
  g.scale(1 - 2 * pad, 1 - 2 * pad);
  if (!o.heartOnly) g.drawImage(await svgImage(signSVG(preset).replace("<svg", `<svg width="${S}" height="${S}"`)), 0, 0, S, S);
  heartCache = heartCache || renderArtifact(S);
  const k = o.small ? HEART_K.small : HEART_K.logo;
  g.drawImage(heartCache, (S - S * k) / 2, (S - S * k) / 2, S * k, S * k);
  g.restore();
  return downscale(c, o.size).toDataURL(o.type || "image/png", o.quality || 0.95);
};
window.ready = true;
</script></body></html>
