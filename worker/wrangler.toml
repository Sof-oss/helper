# Для тех, кто разворачивает через командную строку: npx wrangler deploy (из папки worker).
# Секреты: npx wrangler secret put GITHUB_TOKEN, npx wrangler secret put TURNSTILE_SECRET
name = "hotz-guides"
main = "guide-submit.js"
compatibility_date = "2025-01-01"
