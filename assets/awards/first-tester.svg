<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 72">
  <!-- Нашивка «Первый тестер»: щиток как у группировок, сверху полоса «радиационной опасности»,
       в центре - «баг» в прицеле дозиметра, снизу звезда - первый -->
  <defs>
    <clipPath id="ft-s"><path d="M7 3h50a3 3 0 0 1 3 3v34c0 14-12 24-28 30C16 64 4 54 4 40V6a3 3 0 0 1 3-3z"/></clipPath>
    <pattern id="ft-hz" width="7" height="7" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="7" height="7" fill="#15130c"/><rect width="3.5" height="7" fill="#e3b53c"/>
    </pattern>
    <radialGradient id="ft-bg" cx=".5" cy=".55" r=".65">
      <stop offset="0" stop-color="#3b4224"/><stop offset=".7" stop-color="#20240f"/><stop offset="1" stop-color="#121409"/>
    </radialGradient>
    <radialGradient id="ft-glow" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#b8f04a" stop-opacity=".55"/><stop offset="1" stop-color="#b8f04a" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <path d="M7 3h50a3 3 0 0 1 3 3v34c0 14-12 24-28 30C16 64 4 54 4 40V6a3 3 0 0 1 3-3z" fill="url(#ft-bg)"/>
  <g clip-path="url(#ft-s)">
    <rect x="0" y="0" width="64" height="12.5" fill="url(#ft-hz)"/>
    <rect x="0" y="12.5" width="64" height="1.6" fill="#0a0b06"/>
    <!-- потёртости ткани -->
    <path d="M10 52l6-3M47 22l5 2M12 24l3 4M50 47l-4 4" stroke="#0c0e06" stroke-width="1" opacity=".5"/>
  </g>
  <!-- строчка -->
  <path d="M10 18h44v21c0 11-9 18-22 23C19 57 10 50 10 39z" fill="none" stroke="#e3b53c" stroke-opacity=".45" stroke-width="1.1" stroke-dasharray="2.6 2.2"/>
  <!-- свечение аномалии -->
  <circle cx="32" cy="36" r="15" fill="url(#ft-glow)"/>
  <!-- прицел -->
  <circle cx="32" cy="36" r="12" fill="none" stroke="#e3b53c" stroke-width="1.6"/>
  <path d="M32 21.5v5M32 45.5v5M17.5 36h5M41.5 36h5" stroke="#e3b53c" stroke-width="1.8" stroke-linecap="square"/>
  <!-- баг (жук) -->
  <g stroke="#b8f04a" stroke-width="1.3" stroke-linecap="round" fill="none">
    <path d="M27.6 33.5l-3.6-2.2M27.2 37h-4M27.6 40.4l-3.6 2.4M36.4 33.5l3.6-2.2M36.8 37h4M36.4 40.4l3.6 2.4"/>
    <path d="M30.6 29.6l-1.8-2.6M33.4 29.6l1.8-2.6"/>
  </g>
  <circle cx="32" cy="31.2" r="2.3" fill="#b8f04a"/>
  <ellipse cx="32" cy="37.4" rx="4.6" ry="5.8" fill="#b8f04a"/>
  <path d="M32 32.4v10.6" stroke="#20240f" stroke-width="1.1"/>
  <circle cx="30.2" cy="36" r=".9" fill="#20240f"/><circle cx="33.8" cy="39.2" r=".9" fill="#20240f"/>
  <!-- звезда «первый» -->
  <path d="M32 52.2l1.75 3.55 3.9.57-2.83 2.76.67 3.9L32 61.15l-3.49 1.83.67-3.9-2.83-2.76 3.9-.57z" fill="#e3b53c"/>
  <!-- кант -->
  <path d="M7 3h50a3 3 0 0 1 3 3v34c0 14-12 24-28 30C16 64 4 54 4 40V6a3 3 0 0 1 3-3z" fill="none" stroke="#e3b53c" stroke-width="3" stroke-linejoin="round"/>
</svg>
