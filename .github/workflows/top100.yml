# Обновление Топ-100: выгрузка игроков из API игры -> top100-data.js и top100-players.json -> коммит -> деплой.
# Нужен секрет репозитория ZONE_TOKEN (Settings → Secrets and variables → Actions):
# токен API игры (значение заголовка authorization без слова Bearer).
#
# Запуск - каждый день в 02:55 МСК с cron-job.org: POST https://api.github.com/repos/Sof-oss/helper/actions/workflows/top100.yml/dispatches
# с телом {"ref":"main"} и fine-grained токеном GitHub (только этот репозиторий, Actions: Read and write).
# schedule GitHub не используем: он запускал с опозданием на 4-5 часов.
#
# Токен игры живёт около суток, поэтому его надо обновлять каждый день до 02:55 МСК: скопировать в расширении
# HotZ Helper (Настройки → Данные → Токен игры → «Копировать») и вставить в секрет ZONE_TOKEN (Update secret).
# Токен должен действовать хотя бы до 04:00 МСК - выгрузка идёт 10-20 минут.
# Если токен истёк, запуск падает (GitHub пришлёт письмо), а сайт остаётся с прошлыми данными.
name: Обновление Топ-100

on:
  workflow_dispatch: # cron-job.org в 02:55 МСК или кнопка Run workflow на вкладке Actions (нужен действующий ZONE_TOKEN)

permissions:
  contents: write # коммит обновлённых данных
  actions: write # запуск деплоя (pages.yml)

concurrency:
  group: top100-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Europe/Moscow # скрипты считают даты как на компьютере в Москве
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Выгрузка игроков из API игры
        env:
          ZONE_TOKEN: ${{ secrets.ZONE_TOKEN }}
        run: node fetch-players.js

      - name: Сборка рейтингов
        run: node build-top100.js

      - name: Коммит данных
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add top100-data.js top100-players.json top100/history top100/players top100/factions.json top100/clans.json top100/clans-history.json
          if git diff --cached --quiet; then
            echo "Данные не изменились"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Топ-100: обновление $(date '+%d.%m.%Y %H:%M')"
            git pull --rebase
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # коммит от GITHUB_TOKEN сам деплой не запускает (защита GitHub от циклов) - запускаем его явно.
      # Dispatch сразу после push иногда резолвит ветку в предыдущий SHA, и деплой собирает старые данные
      # (так 12.11 уехали данные за 11.11). Поэтому ждём, пока GitHub отдаст свежий SHA, и иначе падаем:
      # красный запуск с письмом лучше тихого деплоя вчерашних данных.
      - name: Деплой
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          for i in $(seq 1 30); do
            if [ "$(git ls-remote origin refs/heads/main | cut -f1)" = "$sha" ]; then break; fi
            sleep 5
          done
          remote=$(git ls-remote origin refs/heads/main | cut -f1)
          if [ "$remote" != "$sha" ]; then
            echo "Ветка main на GitHub всё ещё на $remote, свежий коммит $sha - деплой не запускаю" >&2
            exit 1
          fi
          gh workflow run pages.yml --ref main
