name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write # сохранить автоматически импортированные новости в site-news.json
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # вся история: build.js берёт даты коммитов для lastmod в sitemap.xml

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci # esbuild для сжатия css и js, playwright-core для картинок-превью (Chrome в GitHub Actions уже есть)

      - name: Tests and lint
        run: npm test && npm run lint

      - name: Build
        run: node build-changelog.js && node build-guide-images.js && node build.js && node build-previews.js # build-changelog.js импортирует новости в site-news.json и готовит блок «Новости сайта», build-guide-images.js - копии картинок гайдов для телефонов

      # Сохраняем только редактируемые новости, а не сгенерированные файлы сайта.
      # [skip ci] не даёт запускать ещё одну сборку на служебный коммит.
      # Обычный push (без force): если main уже изменился, он не затрёт новые правки.
      - name: Save imported site news
        run: |
          if ! git diff --quiet -- site-news.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- site-news.json
            git commit -m "Сохранены новости сайта [skip news] [skip ci]"
            git push origin HEAD:main
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
